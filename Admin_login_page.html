<style>
        .gradient-green-bg { background-image: linear-gradient(135deg, #00A651 0%, #006B35 100%); }

<body class="bg-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<main class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-lg p-6 md:p-10 border border-outline-variant/30 flex flex-col gap-6 md:gap-8">
<!-- Header -->
<header class="flex flex-col items-center gap-2 text-center">
<div class="w-12 h-12 md:w-16 md:h-16 gradient-green-bg rounded-full flex items-center justify-center shadow-sm mb-2">
<span class="material-symbols-outlined text-on-primary text-2xl md:text-3xl" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">
                Smart Super Shop
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">Store Administration</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-5 w-full">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-lg">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none font-body-md text-body-md text-on-surface placeholder:text-muted shadow-sm" id="email" name="email" placeholder="admin@smartsupershop.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-lg">lock</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none font-body-md text-body-md text-on-surface placeholder:text-muted shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="mt-2 w-full gradient-green-bg text-on-primary font-headline-sm text-headline-sm py-3 rounded-full shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">login</span>
</button>
</form>
<!-- Footer subtly integrated -->
<div class="text-center mt-4">
<span class="material-symbols-outlined text-muted text-sm align-middle mr-1">security</span>
<span class="font-micro text-micro text-muted">Secure Internal Portal</span>
</div>
</main>
</body></html>
